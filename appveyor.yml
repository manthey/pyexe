init:
  - SET PROJDIR=%cd%
  - SET ORIGPATH=%PATH%
  # Print the build system version
  - ver

build_script:
  - ps: |
      if (-not (Test-Path "$env:ALTPYTHON\python.exe")) {
        iex "choco install python311 --version=3.11.9 --no-progress --params /InstallDir:$env:ALTPYTHON"
      }
  # Upgrade the bootstrap python version
  - "SET PATH=%ALTPYTHON%;%ALTPYTHON%\\Scripts;%ORIGPATH%"
  - python -m pip install --upgrade requests
  - "python install_python.py %INSTALL_OPTIONS% --out=%PYTHON% --force"
  - del /S /Q %PYTHON%\*.pyc >NUL
  # Use the specific python version for building
  - "SET PATH=%PYTHON%;%PYTHON%\\Scripts;%ORIGPATH%"
  - "%PYBIN% -m pip install --upgrade pip"
  - "%PYBIN% -m pip install --upgrade %PACKAGES%"
  # Generate the list of modules we need to import
  - del /S /Q %PYTHON%\*.pyc >NUL
  - "%PYBIN% modules_pyexe.py pyexe.py"
  # Install PyInstaller.
  - "%PYBIN% -m pip install pyinstaller==6.22.3"
  # Copy a build hook to PyInstaller to include the cacerts.pem file for pip.
  - "copy hooks\\hook*.* %PYTHON%\\Lib\\site-packages\\PyInstaller\\hooks\\."
  - del /S /Q %PYTHON%\*.pyc >NUL
  # Save the artifact immediately
  - appveyor PushArtifact pyexe.py
  - "%PYBIN% -m PyInstaller --onefile pyexe.py --exclude-module FixTk --exclude-module tcl --exclude-module tk --exclude-module _tkinter --exclude-module tkinter --exclude-module Tkinter --runtime-hook hooks\\rth_subprocess.py --runtime-hook hooks\\rth_pip.py --runtime-hook hooks\\pyi_rth_multiprocessing.py --icon %PYTHON%\\pythonw.exe"
  - cp dist\pyexe.exe %OUTPUT%
  # Save the artifact immediately
  - appveyor PushArtifact %OUTPUT%

test_script:
  # Report version
  - "%OUTPUT% -VV"
  # Sometimes we send test data to this directory
  - mkdir c:\temp
  - SET PATH=%ORIGPATH%
  - "%ALTPYTHON%\\python -m pip install pytest"
  - cd tests
  # Build a zipapp for our tests; we use the bootstrap python to do it.
  - "%ALTPYTHON%\\python -m zipapp --output ..\\sample_zipapp.pyz -p \"/usr/bin/env python\" sample_zipapp"
  # Make sure we only have original files here.
  - git clean -fxd .
  - "%ALTPYTHON%\\python -m pytest -l --cache-clear --exe=..\\%OUTPUT%"
  # We can test the tests against the master python.  We have to exclude a few
  # tests that only work on the stand-alone build.
  # Make sure we only have original files here.
  - git clean -fxd .
  - "%ALTPYTHON%\\python -m pytest -l --cache-clear --exe=%PYBIN% -m \"not pyexe\""

deploy:
  - provider: GitHub
    tag: 'pyexe-latest'
    release: 'Release pyexe-latest'
    auth_token:
      secure: PGsGUDU6oqIy7zCyTMwIWlzf4TbJtuIgqmWb9ZLqNlM13AAaxWfDlzDlG+0CyHFx
    artifact: "%OUTPUT%"
    force_update: true
    on:
      branch: master

  - provider: GitHub
    tag: $(appveyor_repo_tag_name)
    release: Release $(appveyor_repo_tag_name)
    auth_token:
      secure: PGsGUDU6oqIy7zCyTMwIWlzf4TbJtuIgqmWb9ZLqNlM13AAaxWfDlzDlG+0CyHFx
    artifact: "%OUTPUT%"
    force_update: true
    on:
      appveyor_repo_tag: true
