[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyexe"
description = "Stand-Alone Python Interpreter"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dynamic = ["version"]

[tool.setuptools]
# This is not really an installable package; the build-system section exists
# so that setuptools_scm can generate py_version.py.  Specify the modules
# explicitly so that stray directories in a checkout cannot break the
# automatic package discovery.
py-modules = ["pyexe"]
packages = []

[dependency-groups]
# Development and test requirements.  Install with `pip install --group dev`
# (pip 25.1+); tox uses this group for its test environment.
dev = [
    "pytest",
    "setuptools_scm",
    # For install_python.py and for pre-commit.
    "requests",
    "pre-commit",
]

[tool.setuptools_scm]
# The version is derived from the git tags (vA.B.C), and the py_version.py
# module is written from the template below so the stand-alone executable
# reports the tagged version.  Generate it with:
#   python -m setuptools_scm --force-write-version-files
write_to = "py_version.py"
write_to_template = """\
# The version and main description string for the Stand-Alone Python
# Interpreter.  This file is generated by setuptools_scm from the git tags
# (see pyproject.toml); edit the tags, not this file.
Version = 'v{version}'
Description = 'Stand-Alone Python Interpreter'
"""
