[tox]
envlist = py3
# This is not an installable package; do not build one.
no_package = true

[testenv]
# The tests run pyexe.py from a source checkout against a plain python; the
# pyexe-marked tests only apply to a built stand-alone executable, which the
# CI workflow (.github/workflows/build.yml) builds and tests separately.
# Use the dev dependency group from pyproject.toml.
dependency_groups = dev
changedir = tests
commands =
    # Generate py_version.py from the git tags, as the CI build does.
    python -m setuptools_scm --force-write-version-files
    # Build the zipapp that the tests use.
    python -m zipapp --output ../sample_zipapp.pyz -p "/usr/bin/env python" sample_zipapp
    pytest -l --cache-clear --exe={envpython} -m "not pyexe" {posargs}
